[project]
name = "specforge"
version = "0.2.0"
description = "Speculative Decoding Training Framework"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pre-commit",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision",
    "transformers>=4.46.0,<5",
    "qwen-vl-utils",
    "datasets",
    "setuptools",
    "tqdm",
    "wandb",
    "psutil",
    "numpy",
    "accelerate",
    "pydantic",
    "openai-harmony",
    "yunchang",
    "gradio",
    "plotly",
    "pybase64",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["configs", "scripts", "tests"]

[tool.uv]
cache-dir = ".uv_cache"
